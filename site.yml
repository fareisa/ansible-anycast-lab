---
- name: Precheck server hosts
  hosts: server
  gather_facts: true
  roles:
    - precheck_server
  tags:
    - precheck
    - bgp

- name: mikrotik config
  hosts: mikrotik
  gather_facts: false
  module_defaults:
    group/community.routeros.api:
      hostname: "{{ ansible_host }}"
      username: "{{ user_mikrotik }}"
      password: "{{ pass_mikrotik }}"
      handle_absent_entries: "remove"
      handle_entries_content: "remove_as_much_as_possible"
  roles:
    - presetup_mikrotik
    - ipaddress_mikrotik
    - dhcp_mikrotik
    - bgp_mikrotik
  tags:
    - mikrotik
    - bgp

- name: lb4 config
  hosts: lb4
  roles:
    - presetup_anycast_int
    - haproxy
    - frr
  tags:
    - lb4
    - bgp    
        
- name: lb7 config
  hosts: lb7
  roles:
    - haproxy
  tags:
    - lb7

- name: app config
  hosts: app
  roles:
    - web_app
  tags:
    - app
