- name: makesure haproxy is start and enabled 
  service:
    name: haproxy
    state: started
    enabled: true

- name: deploy configuration 
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/haproxy -c -f %s"
  notify: restart haproxy