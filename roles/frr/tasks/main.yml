- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: Download FRR GPG key
  ansible.builtin.get_url:
    url: https://deb.frrouting.org/frr/keys.gpg
    dest: /usr/share/keyrings/frrouting.gpg
    mode: '0644'

- name: Add FRR DEB822 repository
  ansible.builtin.deb822_repository:
    name: frr
    types: deb
    uris: https://deb.frrouting.org/frr
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: "{{ frr_version }}"
    signed_by: /usr/share/keyrings/frrouting.gpg
    state: present

- name: Update APT cache and install necssary packages
  ansible.builtin.apt:
    name:
      - frr
      - frr-pythontools
    state: present
    update_cache: true

- name: makesure service is start and enabled
  service:
    name: frr
    state: started
    enabled: true

- name: copy template daemon config
  template:
    src: frr-daemons.j2
    dest: /etc/frr/daemons
  notify: Restart FRR

- name: Flush FRR handler
  ansible.builtin.meta: flush_handlers

- name: Deploy FRR configuration for bgp
  ansible.builtin.template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: "0640"
  notify: Restart FRR

- block:
    - name: Verify FRR BGP
      ansible.builtin.command:
        cmd: vtysh -c "show bgp summary"
      register: bgp_summary
      changed_when: false

    - name: Verify FRR BGP summary
      ansible.builtin.command:
        cmd: vtysh -c "show bgp summary json"
      register: bgp_summary
      changed_when: false
      failed_when: bgp_summary.rc != 0

    - name: Parse BGP summary
      ansible.builtin.set_fact:
        bgp_summary_json: "{{ bgp_summary.stdout | from_json }}"

    - name: Validate BGP neighbors
      ansible.builtin.assert:
        that:
          - bgp_summary_json.ipv4Unicast.peers[item].state == "Established"
        fail_msg: "BGP neighbor {{ item }} is not Established"
        success_msg: "BGP neighbor {{ item }} is Established"
      loop: "{{ bgp_expected_neighbors }}"

  rescue:
    - name: Restart FRR service after failed BGP check
      ansible.builtin.command: /bin/true
      notify: Restart FRR

    - name: Flush FRR handler
      ansible.builtin.meta: flush_handlers

    - name: Wait 5 seconds for FRR to restart
      ansible.builtin.pause:
        seconds: 5

    - name: Re-check FRR BGP summary
      ansible.builtin.command:
        cmd: vtysh -c "show bgp summary json"
      register: bgp_summary
      changed_when: false
      failed_when: bgp_summary.rc != 0

    - name: Parse BGP summary after restart
      ansible.builtin.set_fact:
        bgp_summary_json: "{{ bgp_summary.stdout | from_json }}"

    - name: Validate BGP neighbors after restart
      ansible.builtin.assert:
        that:
          - bgp_summary_json.ipv4Unicast.peers[item].state == "Established"
        fail_msg: "BGP neighbor {{ item }} is not Established after restart"
        success_msg: "BGP neighbor {{ item }} is Established after restart"
      loop: "{{ bgp_expected_neighbors }}"

