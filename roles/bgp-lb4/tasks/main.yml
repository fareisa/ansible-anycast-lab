- name: copy template daemon config
  template:
    src: frr-daemons.j2
    dest: /etc/frr/daemons
  notify: Restart FRR

- name: Deploy FRR configuration for bgp
  ansible.builtin.template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: "0640"
  notify: Restart FRR
