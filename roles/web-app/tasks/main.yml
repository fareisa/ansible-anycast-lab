- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Enable and start Nginx
  service:
    name: nginx
    state: started
    enabled: true

- name: Create application web roots
  file:
    path: "{{ web_root }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ global.directory }}"
    - "{{ zone.directory }}"

- name: Install the global application page
  template:
    src: "{{ global.directory }}.html.j2"
    dest: "{{ web_root }}/{{ global.directory }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"

- name: Install the zone application page
  template:
    src: "{{ zone.directory }}.html.j2"
    dest: "{{ web_root }}/{{ zone.directory }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"

- name: Install the application virtual host configuration
  template:
    src: app-nginx.conf.j2
    dest: /etc/nginx/sites-available/app-services.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx

- name: Enable the application virtual hosts
  file:
    src: /etc/nginx/sites-available/app-services.conf
    dest: /etc/nginx/sites-enabled/app-services.conf
    state: link
  notify: Reload Nginx

- name: Disable the default Nginx virtual host
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Validate Nginx configuration
  command: nginx -t
  changed_when: false