interfaces:
  - default-name: ether1
    comment: 'remote'

  - default-name: ether2
    comment: 'interzone'

  - default-name: 'ether3'
    comment: 'outerzone'

  - default-name: 'ether4'
    comment: 'server interzone'

  - default-name: 'ether5'
    comment: 'not-used'

ip_address:
  - interface: ether2
    address: "{{ mikrotik_5.address.ovs1int }}/24"
    comment: 'to mk1'

  - interface: ether3
    address: "{{ mikrotik_5.address.ovs2int }}/30"
    comment: 'to mk2'

  - interface: ether4
    address: "{{ mikrotik_5.address.ovs3int }}/24"
    comment: 'server interzone'

bgp_instance:
  - name: "{{ inventory_hostname }}"
    router-id: "{{ ansible_host }}"
    as: "{{ asn }}"
    multipath: 1

bgp_connection:

  - name: "{{ bgp_name }}"
    instance: "{{ inventory_hostname }}"
    as: "{{ asn }}"
    remote.as: "{{ hostvars['lb7-1-ganjil']['asn'] }}"
    local.role: ibgp-rr
    remote.address: "{{ lb7_1.address.ovs3int }}"
    output.network: none
    nexthop-choice: force-self
    hold-time: 3s
    keepalive-time: 1s

  - name: "{{ bgp_name }}"
    instance: "{{ inventory_hostname }}"
    as: "{{ asn }}"
    remote.as: "{{ hostvars['mikrotik-1-ganjil']['asn'] }}"
    local.role: ibgp-rr
    remote.address: "{{ mikrotik_1.address.ovs1int }}"
    output.network: none
    nexthop-choice: force-self
    hold-time: 3s
    keepalive-time: 1s

  - name: "{{ bgp_name }}"
    instance: "{{ inventory_hostname }}"
    as: "{{ asn }}"
    remote.as: "{{ hostvars['mikrotik-2-genap']['asn'] }}"
    local.role: ebgp
    remote.address: "{{ mikrotik_2.address.ovs2int.to_mk5 }}"
    output.network: bgp-network
    # output.redistribute: bgp
    hold-time: 3s
    keepalive-time: 1s

address_list:
  # - list: to-lb7
  #   address: 10.11.10.0/24

  # - list: to-mk
  #   address: 10.11.0.0/30

  - list: bgp-network
    address: "{{ anycast_ip }}"

