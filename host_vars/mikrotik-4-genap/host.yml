  - name: "{{ bgp_name }}"
    instance: "{{ inventory_hostname }}"
    as: "{{ asn }}"
    remote.as: "{{ hostvars['mikrotik-1-ganjil']['asn'] }}"
    local.role: ebgp
    remote.address: "{{ mikrotik_1.address.ovs2int }}"
    output.network: bgp-network
    hold-time: 3
    keepalive-time: 1

address_list:
  - list: bgp-network
    address: 10.12.10.0/24

  - list: bgp-network
    address: 10.12.0.0/30

  - list: bgp-network
    address: 10.15.100.10/32

  - list: bgp-network
    address: 10.15.0.0/30

