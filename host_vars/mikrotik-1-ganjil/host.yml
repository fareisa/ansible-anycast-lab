interfaces:
  - default-name: ether1
    comment: 'remote'

  - default-name: ether2
    comment: 'interzone'

  - default-name: 'ether3'
    comment: 'outerzone'

  - default-name: 'ether4'
    comment: 'not used'

  - default-name: 'ether5'
    comment: 'client'

ip_address:
  - interface: ether2
    address: "{{ mikrotik_1.address.ovs1int }}/30"
    comment: 'to mk3'

  - interface: ether3
    address: "{{ mikrotik_1.address.ovs2int }}/30"
    comment: 'to mk4'

  - interface: ether5
    address: "{{ mikrotik_1.address.ovs4int }}/24"

bgp_connection:

## IBGP
  - name: "{{ bgp_name }}"
    instance: "{{ inventory_hostname }}"
    as: "{{ asn }}"
    remote.as: "{{ hostvars['mikrotik-3-ganjil']['asn'] }}"
    local.role: ibgp
    remote.address: "{{ mikrotik_3.address.ovs1int }}"
    hold-time: 3
    keepalive-time: 1

## EBGP
  - name: "{{ bgp_name }}"
    instance: "{{ inventory_hostname }}"
    as: "{{ asn }}"
    remote.as: "{{ hostvars['mikrotik-4-genap']['asn'] }}"
    local.role: ebgp
    remote.address: "{{ mikrotik_4.address.ovs2int }}"
    hold-time: 3
    keepalive-time: 1

dhcp_server:
  - name: dhcp-ganjil
    interface: ether5
    address-pool: dhcp-pool-ganjil

dhcp_pool:
  - name: dhcp-pool-ganjil
    ranges: 10.11.100.100-10.11.100.200

dhcp_network:
  - address: 10.11.100.0/24
    gateway: 10.11.100.1
    dns-server: 10.11.100.1

address_list:
  - list: bgp-network
    address: 10.11.100.0/24

firewall_nat:
  - chain: srcnat
    action: masquerade
    src-address: 10.11.100.0/24
    dst-address: 10.15.100.10/32