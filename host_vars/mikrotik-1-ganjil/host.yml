interfaces:
  - default-name: ether1
    comment: 'remote'

  - default-name: ether2
    comment: 'interzone'

  - default-name: 'ether3'
    comment: 'outerzone'

  - default-name: 'ether4'
    comment: 'not used'

  - default-name: 'ether5'
    comment: 'client'

ip_address:
  - interface: ether2
    address: "{{ mikrotik_1.address.ovs1int }}/30"
    comment: 'to mk3'

  - interface: ether3
    address: "{{ mikrotik_1.address.ovs2int }}/30"
    comment: 'to mk4'

  - interface: ether5
    address: "{{ mikrotik_1.address.ovs4int }}/24"

bgp_connection:
  - name: "{{ bgp_name }}"
    instance: "{{ inventory_hostname }}"
    as: "{{ asn }}"
    remote.as: "{{ hostvars['mikrotik-3-ganjil']['asn'] }}"
    local.role: ibgp
    remote.address: "{{ mikrotik_3.address.ovs1int }}"
    hold-time: 3s
    keepalive-time: 1s
    output.network: bgp-network
    # output.redistribute: null
    # nexthop-choice: null

  - name: "{{ bgp_name }}"
    instance: "{{ inventory_hostname }}"
    as: "{{ asn }}"
    remote.as: "{{ hostvars['mikrotik-4-genap']['asn'] }}"
    local.role: ebgp
    remote.address: "{{ mikrotik_4.address.ovs2int }}"
    # output.redistribute: bgp
    hold-time: 3s
    keepalive-time: 1s
    output.network: bgp-network

dhcp_server:
  - name: dhcp-ganjil
    interface: ether5
    address-pool: dhcp-pool-ganjil

dhcp_pool:
  - name: dhcp-pool-ganjil
    ranges: "{{ client_pool }}"

dhcp_network:
  - address: "{{ client_network }}"
    gateway: "{{ mikrotik_1.address.ovs4int }}"
    dns-server: "{{ mikrotik_1.address.ovs4int }}"

address_list:
  - list: bgp-network
    address: "{{ client_network }}"

