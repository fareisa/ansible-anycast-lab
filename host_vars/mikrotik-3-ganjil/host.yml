interfaces:
  - default-name: ether1
    comment: 'remote'

  - default-name: ether2
    comment: 'interzone'

  - default-name: 'ether3'
    comment: 'outerzone'

  - default-name: 'ether4'
    comment: 'server-interzone'

  - default-name: 'ether5'
    comment: 'not used'

ip_address:
  - interface: ether2
    comment: 'to mk1'
    address: "{{ mikrotik_3.address.ovs1int }}/30"

  - interface: ether3
    comment: 'to mk2'
    address: "{{ mikrotik_3.address.ovs2int }}/30"

  - interface: ether4
    comment: 'server-interzone'
    address: "{{ mikrotik_3.address.ovs3int }}/24"

bgp_connection:

  - name: "{{ bgp_name }}"
    instance: "{{ inventory_hostname }}"
    as: "{{ asn }}"
    remote.as: "{{ hostvars['lb7-1-ganjil']['asn'] }}"
    local.role: ibgp-rr
    remote.address: "{{ lb7_1.address.ovs3int }}"
    output.network: bgp-network
    nexthop-choice: force-self
    hold-time: 3s
    keepalive-time: 1s

  - name: "{{ bgp_name }}"
    instance: "{{ inventory_hostname }}"
    as: "{{ asn }}"
    remote.as: "{{ hostvars['mikrotik-1-ganjil']['asn'] }}"
    local.role: ibgp-rr
    remote.address: "{{ mikrotik_1.address.ovs1int }}"
    output.network: bgp-network
    nexthop-choice: force-self
    hold-time: 3s
    keepalive-time: 1s

  - name: "{{ bgp_name }}"
    instance: "{{ inventory_hostname }}"
    as: "{{ asn }}"
    remote.as: "{{ hostvars['mikrotik-2-genap']['asn'] }}"
    local.role: ebgp
    remote.address: "{{ mikrotik_2.address.ovs2int }}"
    output.network: bgp-network
    hold-time: 3s
    keepalive-time: 1s

address_list:
  - list: bgp-network
    address: 10.11.10.0/24

  - list: bgp-network
    address: 10.11.0.0/30

  - list: bgp-network
    address: "{{ anycast_ip }}"

  - list: bgp-network
    address: 10.15.0.4/30
