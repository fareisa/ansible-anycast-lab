- name: bgp configuration
  hosts: mikrotik
  gather_facts: false
  module_defaults:
    group/community.routeros.api:
      hostname: "{{ ansible_host }}"
      username: "{{ user }}"
      password: "{{ pass }}"
      handle_absent_entries: "remove"
      handle_entries_content: "remove_as_much_as_possible"

  tasks:

    - name: create bgp network address list
      community.routeros.api_modify:
        path: ip firewall address-list
        data: "{{ address_list }}"
      when:
        - address_list is defined
        - address_list | length > 0

    - name: create bgp instance
      community.routeros.api_modify:
        path: routing bgp instance
        data: "{{ bgp_instance }}"
      when: 
        - bgp_instance is defined
        - bgp_instance | length > 0

    - name: create bgp connection
      community.routeros.api_modify:
        path: routing bgp connection
        data: "{{ bgp_connection }}"
      when: 
        - bgp_connection is defined
        - bgp_connection | length > 0

    # - name: create firewall NAT
    #   community.routeros.api_modify:
    #     path: ip firewall nat
    #     data: "{{ firewall_nat }}"
    #   when: 
    #     - firewall_nat is defined
    #     - firewall_nat | length > 0

- name: Configure FRR
  hosts: lb4
  become: true
  gather_facts: false

  tasks:

    - name: Deploy FRR configuration
      ansible.builtin.template:
        src: ../templates/frr.conf.j2
        dest: /etc/frr/frr.conf
        owner: frr
        group: frr
        mode: "0640"
      notify: Restart FRR

  handlers:
    - name: Restart FRR
      ansible.builtin.systemd:
        name: frr
        state: restarted

