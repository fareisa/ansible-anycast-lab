- name: Install and configure Nginx application services
  hosts: app
  become: true
  gather_facts: true

  tasks:
    # - name: Set the Ganjil application zone
    #   ansible.builtin.set_fact:
    #     nginx.zone.directory: ganjil
    #   when: inventory_hostname == 'app-1-ganjil'

    # - name: Set the Genap application zone
    #   ansible.builtin.set_fact:
    #     nginx.zone.directory: genap
    #   when: inventory_hostname in ['app-2-lb-genap', 'app-3-lb-genap']

    # - name: Check that this host has a supported application zone
    #   ansible.builtin.assert:
    #     that:
    #       - nginx.zone.directory is defined
    #     fail_msg: 'This application host is not mapped to Ganjil or Genap.'

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Create application web roots
      ansible.builtin.file:
        path: "{{ nginx.web_root }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ nginx.global.directory }}"
        - "{{ nginx.zone.directory }}"

    - name: Install the global application page
      ansible.builtin.template:
        src: ../templates/app-global.html.j2
        dest: "{{ nginx.web_root }}/{{ nginx.global.directory }}/index.html"
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Install the zone application page
      ansible.builtin.template:
        src: ../templates/{{ nginx.zone.directory }}.html.j2
        dest: "{{ nginx.web_root }}/{{ nginx.zone.directory }}/index.html"
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Install the application virtual host configuration
      ansible.builtin.template:
        src: ../templates/app-nginx.conf.j2
        dest: /etc/nginx/sites-available/app-services.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload Nginx

    - name: Enable the application virtual hosts
      ansible.builtin.file:
        src: /etc/nginx/sites-available/app-services.conf
        dest: /etc/nginx/sites-enabled/app-services.conf
        state: link
      notify: Reload Nginx

    - name: Disable the default Nginx virtual host
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Enable and start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
