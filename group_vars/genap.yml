## bgp config
asn: 65012
bgp_name: bgp-genap

### network pool config
## dhcp client
client_network: 10.12.100.0/24
client_pool: 10.12.100.100-10.12.100.200
## network bgp 
lb7_network: 10.12.10.0/24

## app config
zone:
  port: 8081
  directory: app-genap-1

### server
## bgp neighbors
bgp_frr:
  - name: "{{ asn }}"
    router_id: "{{ ansible_host }}"
    neighbor:
      - "{{ mikrotik_4.address.ovs3int }} remote-as {{ hostvars['mikrotik-4-genap']['asn'] }}"
    network:
      - "{{ anycast_ip }}/32"
      - "{{ lb7_network }}"

bgp_expected_neighbors:
  - "{{ mikrotik_4.address.ovs3int }}"

### haproxy lb7 setup
lb7_haproxy_acl:
  hostname:
    - acl_name: host_app-genap
      hostname: app-genap.wahaha.lab

    - acl_name: host_app-global
      hostname: app-global.wahaha.lab

    - acl_name: host_app-ganjil
      hostname: app-ganjil.wahaha.lab

  network:
    - acl_name: net_genap
      network: "{{ client_network }}"

    - acl_name: net_ganjil
      network: "{{ hostvars['lb7-1-ganjil']['client_network'] }}"

lb7_haproxy_healthcheck:
  - name: app-ganjil
    uri: /
    hostname: app-ganjil.wahaha.lab

  - name: app-global
    uri: /
    hostname: app-global.wahaha.lab

  - name: app-genap
    uri: /
    hostname: app-genap.wahaha.lab

lb7_haproxy_vhosts:
  - backend: app-genap
    servers:
      - "{{ lb4_2.address.ovs5int }}:{{ zone.port }} check healthcheck app-genap"
      - "{{ lb4_3.address.ovs5int }}:{{ zone.port }} check healthcheck app-genap"
    rule: host_app-genap net_genap

  - backend: app-global
    servers:
      - "{{ lb4_1.address.ovs6int }}:{{ app_global.port }} check backup healthcheck app-global"
      - "{{ lb4_2.address.ovs5int }}:{{ app_global.port }} check healthcheck app-global"
      - "{{ lb4_3.address.ovs5int }}:{{ app_global.port }} check healthcheck app-global"
    rule: host_app-global

  - backend: app-ganjil
    servers:
      - "{{ lb4_1.address.ovs6int }}:{{ zone.port }} check healthcheck app-genap"
    rule: host_app-ganjil net_ganjil

lb4_haproxy_vhosts:
  - backend: global-app
    frontend: global-ingress
    frontend_port: "{{ app_global.port }}"
    servers:
      - "{{ app_2_lb.address.ovs7int }}:{{ app_global.port }} check"
      - "{{ app_3_lb.address.ovs7int }}:{{ app_global.port }} check"

  - backend: genap-app
    frontend: genap-ingress
    frontend_port: "{{ zone.port }}"
    servers:
      - "{{ app_2_lb.address.ovs7int }}:{{ zone.port }} check"
      - "{{ app_3_lb.address.ovs7int }}:{{ zone.port }} check"
